name: tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Run standard suite
        working-directory: packages/just-bash
        run: |
          pnpm exec vitest run \
            --exclude src/security/fuzzing/ \
            --exclude src/commands/python3/ \
            --exclude src/commands/sqlite3/ \
            --exclude src/commands/js-exec/ \
            --exclude src/agent-examples/python-scripting.test.ts \
            --reporter=dot
